name: AI Services CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-services-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests, scan contract, and benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # These tests MUST NOT use live OCR, OpenRouter, or provider credentials.
      MOCK_VISION: "true"
      GEMINI_API_KEY: "mock"
      GOOGLE_APPLICATION_CREDENTIALS: ""
      OPENROUTER_API_KEY: ""
      TF_CPP_MIN_LOG_LEVEL: "3"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path:
            - requirements.txt
            - requirements-ci.txt

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run offline unit and API tests
        # Six pre-existing FoodKeeper importer tests require an importer
        # interface no longer present on main. Keep this exception visible
        # and separate rather than hiding or falsely reporting full coverage.
        run: python -m pytest tests/ --ignore=tests/test_foodkeeper_import.py -v

      - name: Verify exact checked-in OpenAPI contract
        run: python -m pytest tests/test_scan_contract.py::TestScanContracts::test_openapi_snapshot_is_valid_and_matches_live_schema -v

      - name: Compare deterministic scan benchmarks with baseline
        run: |
          python -m benchmarks.runner \
            --baseline benchmarks/baselines/default_baseline.json \
            --output /tmp/mealventory-ai-benchmark-report.json

      - name: Report existing FoodKeeper importer test debt (nonblocking)
        # This is an intentionally visible known failure, NOT a blanket skip
        # of future tests. Remove once importer/tests are reconciled.
        continue-on-error: true
        run: python -m pytest tests/test_foodkeeper_import.py -v

  docker-build:
    name: Build AI Services runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production Dockerfile
        run: docker build --tag mealventory-ai-services:ci .
