name: AI Services CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests and scan contract
    runs-on: ubuntu-latest
    env:
      MOCK_VISION: "true"
      GEMINI_API_KEY: "mock"
      GOOGLE_APPLICATION_CREDENTIALS: ""
      OPENROUTER_API_KEY: ""
      TF_CPP_MIN_LOG_LEVEL: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run offline suite
        run: |
          python -m pytest tests/ --ignore=tests/test_foodkeeper_import.py -v

      - name: Verify exact checked-in scan contract
        run: |
          python -m pytest tests/test_scan_contract.py::TestScanContracts::test_openapi_snapshot_is_valid_and_matches_live_schema -v

      - name: Offline scan benchmark regression checks
        run: |
          python -m benchmarks.runner --baseline benchmarks/baselines/default_baseline.json --output /tmp/mealventory-ai-benchmark-report.json

      - name: Report known FoodKeeper importer test failures
        continue-on-error: true
        run: |
          python -m pytest tests/test_foodkeeper_import.py -v

  docker-build:
    name: Docker runtime image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: |
          docker build --tag mealventory-ai-services:ci .
